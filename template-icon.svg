<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#15171A"/>
      <stop offset="100%" style="stop-color:#2D3748"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BD9D"/>
      <stop offset="100%" style="stop-color:#00A085"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <g transform="translate(64,64)">
    <!-- Chip body -->
    <rect x="16" y="16" width="96" height="96" rx="8" fill="url(#chip)"/>
    <!-- Pins top -->
    <rect x="32" y="0" width="8" height="16" rx="2" fill="#CBD5E0"/>
    <rect x="48" y="0" width="8" height="16" rx="2" fill="#CBD5E0"/>
    <rect x="64" y="0" width="8" height="16" rx="2" fill="#CBD5E0"/>
    <rect x="80" y="0" width="8" height="16" rx="2" fill="#CBD5E0"/>
    <!-- Pins bottom -->
    <rect x="32" y="112" width="8" height="16" rx="2" fill="#CBD5E0"/>
    <rect x="48" y="112" width="8" height="16" rx="2" fill="#CBD5E0"/>
    <rect x="64" y="112" width="8" height="16" rx="2" fill="#CBD5E0"/>
    <rect x="80" y="112" width="8" height="16" rx="2" fill="#CBD5E0"/>
    <!-- Pins left -->
    <rect x="0" y="32" width="16" height="8" rx="2" fill="#CBD5E0"/>
    <rect x="0" y="48" width="16" height="8" rx="2" fill="#CBD5E0"/>
    <rect x="0" y="64" width="16" height="8" rx="2" fill="#CBD5E0"/>
    <rect x="0" y="80" width="16" height="8" rx="2" fill="#CBD5E0"/>
    <!-- Pins right -->
    <rect x="112" y="32" width="16" height="8" rx="2" fill="#CBD5E0"/>
    <rect x="112" y="48" width="16" height="8" rx="2" fill="#CBD5E0"/>
    <rect x="112" y="64" width="16" height="8" rx="2" fill="#CBD5E0"/>
    <rect x="112" y="80" width="16" height="8" rx="2" fill="#CBD5E0"/>
    <!-- ESP text -->
    <text x="64" y="78" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="bold" fill="#15171A">ESP</text>
  </g>
</svg>
